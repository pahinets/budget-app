version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-app-postgres
    environment:
      POSTGRES_USER: pah
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: postgres
    ports:
      - "2026:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: